<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출동 전 브리핑</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--text:#1a1d23;--muted:#667085;--line:#e4e7ec;
  --now:#d92d20;--now-bg:#fef3f2;--remote:#b54708;--remote-bg:#fffaeb;--later:#067647;--later-bg:#ecfdf3;
  --l1:#067647;--l1-bg:#dcfae6;--l2:#b54708;--l2-bg:#fef0c7;--l3:#475467;--l3-bg:#eaecf0;--accent:#1570ef;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--surface:#181b21;--text:#e6e8ec;--muted:#98a2b3;--line:#2a2f38;
  --now:#f97066;--now-bg:#3a1714;--remote:#fdb022;--remote-bg:#33260b;--later:#47cd89;--later-bg:#0e2a1c;
  --l1:#47cd89;--l1-bg:#0e2a1c;--l2:#fdb022;--l2-bg:#33260b;--l3:#98a2b3;--l3-bg:#262b33;--accent:#53b1fd;}}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#181b21;--text:#e6e8ec;--muted:#98a2b3;--line:#2a2f38;
  --now:#f97066;--now-bg:#3a1714;--remote:#fdb022;--remote-bg:#33260b;--later:#47cd89;--later-bg:#0e2a1c;
  --l1:#47cd89;--l1-bg:#0e2a1c;--l2:#fdb022;--l2-bg:#33260b;--l3:#98a2b3;--l3-bg:#262b33;--accent:#53b1fd;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header h1{font-size:20px;margin:0}
header p{margin:2px 0 12px;color:var(--muted);font-size:13px}
.mock{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--l2-bg);color:var(--l2);margin-left:6px;vertical-align:middle}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.now b{color:var(--now)}.kpi.remote b{color:var(--remote)}.kpi.later b{color:var(--later)}
.kpi.active{outline:2px solid var(--accent)}
.sub{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted);margin-bottom:12px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters input,.filters select{flex:1 1 140px;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;margin-bottom:8px}
.card.now{border-left-color:var(--now)}.card.remote{border-left-color:var(--remote)}.card.later{border-left-color:var(--later)}
.head{padding:12px;cursor:pointer;display:grid;gap:4px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.title{font-weight:700;font-size:15px}
.muted{color:var(--muted);font-size:12px}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.b-now{background:var(--now-bg);color:var(--now)}.b-remote{background:var(--remote-bg);color:var(--remote)}.b-later{background:var(--later-bg);color:var(--later)}
.b-L1{background:var(--l1-bg);color:var(--l1)}.b-L2{background:var(--l2-bg);color:var(--l2)}.b-L3{background:var(--l3-bg);color:var(--l3)}
.b-grade{border:1px solid var(--line);color:var(--muted)}
.body{display:none;border-top:1px solid var(--line);padding:12px}
.card.open .body{display:block}
.caution{background:var(--remote-bg);color:var(--text);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.caution div+div{margin-top:2px}
.contact a{color:var(--accent)}
.section{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px}
.section h3{margin:0 0 6px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.diag{margin:8px 0;padding:8px;border-radius:6px;background:var(--bg)}
.cause{font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.tbl th,.tbl td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px}
.lbl{font-size:12px;color:var(--muted);margin-top:8px}
.top10{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
.top10 summary{cursor:pointer;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:24px}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let fDispatch = "";

function levelOf(card){ // 대표 판단 레벨 = 첫 섹션 첫 판단
  return card.sections[0].diagnoses[0].level;
}

function renderKpis(){

  $("#kpis").innerHTML = Object.entries(DISPATCH).map(([k,v]) =>
    `<div class="kpi ${k} ${fDispatch===k?"active":""}" data-k="${k}"><b>${cnt[k]}</b><span>${v.label}</span></div>`).join("");
  document.querySelectorAll(".kpi").forEach(el => el.onclick = () => { fDispatch = fDispatch===el.dataset.k ? "" : el.dataset.k; renderKpis(); renderList(); });
  const lv = {L1:0,L2:0,L3:0};
  CARDS.forEach(c => c.sections.forEach(s => s.diagnoses.forEach(d => lv[d.level]++)));
  $("#levels").innerHTML = Object.entries(lv).map(([k,n]) => `<span class="badge b-${k}">${LEVEL[k]} ${n}</span>`).join("");
}

function diagHtml(d){
  const cause = d.primary.length ? d.primary.map(esc).join(" / ") : "—";
  const meta = [];
  if (d.level==="L1") meta.push(`같은 증상 ${d.same_symptom_count}건`, `재발률 ${Math.round(d.recur_rate*100)}%`, `신뢰도 ${d.confidence}`);
  if (d.level==="L2") meta.push(`전체 기록 중 ${Math.round(d.share*100)}%`);
  if (d.natural_recovery) meta.push(`자연복구 이력 ${d.natural_recovery}건`);
  const cands = d.candidates.length ? `<div class="muted">후보: ${d.candidates.map(([c,n])=>`${esc(c)} ${n}건`).join(", ")}</div>` : "";
  const recs = d.records.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>조치일</th><th>실제원인</th><th>조치내용</th><th>재발</th><th>작업자</th></tr></thead><tbody>${
    d.records.map(r=>`<tr><td>${r.recent?"🔺":""}${r.date}</td><td>${esc(r.cause)}</td><td>${esc(r.action)}</td><td>${r.recur}</td><td>${esc(r.worker)}</td></tr>`).join("")}</tbody></table></div>` : "";
  return `<div class="diag"><div class="row"><span class="badge b-${d.level}">${LEVEL[d.level]}</span><span class="muted">${d.group}</span></div>
    <div class="cause">${d.level==="L2"?"(추정) ":""}${cause}</div><div class="muted">${meta.join(" · ")}</div>${cands}${recs}</div>`;
}

    s.alarms.map(a=>`<tr><td>${esc(a.name)}</td><td>${a.grade}</td><td>${a.start}~${a.end}</td><td>${a.status==="미해제"?"🔴 미해제":"해제"}</td></tr>`).join("")}</tbody></table></div>`;
  const eq = s.equipment.length
    ? s.equipment.map(e=>`<div class="muted">${esc(e.serial)} · ${esc(e.model)} · FW ${esc(e.firmware)}</div>
        <div class="chips">${e.signals.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}<span class="muted">추정 보강</span></div>`).join("")
    : s.equipment_ref.length
      ? `<div class="muted">같은 장비구분 기록 없음 · 참고: ${s.equipment_ref.map(e=>`${e.equip_type} ${esc(e.model)}`).join(", ")}</div>`
      : `<div class="muted">장비 기록 없음</div>`;
  const mats = s.materials.length
    ? `<div class="chips">${s.materials.map(m=>`<span class="chip">${esc(m.item)}${m.estimated?" (추정)":""}</span>`).join("")}</div>`
    : `<div class="muted">별도 자재 없음</div>`;
  return `<div class="section"><h3>${s.equip_type}<span class="badge b-${s.dispatch.class}">${DISPATCH[s.dispatch.class].label}</span><span class="muted">${esc(s.dispatch.reason)}</span></h3>
    ${alarms}<div class="lbl">원인 판단</div>${s.diagnoses.map(diagHtml).join("")}
    <div class="lbl">장비</div>${eq}<div class="lbl">챙길 자재</div>${mats}</div>`;
}

function cardHtml(c){
  const d0 = c.sections[0].diagnoses[0];
  const cause = d0.primary.length ? d0.primary.join(" / ") : "원인 판단 불가";
  return `<div class="card ${c.dispatch.class}" data-id="${c.card_id}">
    <div class="head">
      <div class="row"><span class="badge b-${c.dispatch.class}">${DISPATCH[c.dispatch.class].label}</span><span class="muted">${esc(c.dispatch.reason)}</span></div>
      <div class="row"><span class="title">${esc(c.site.name)}</span><span class="muted">${c.site.id} · ${c.site.branch}</span>${c.site.high_work?'<span title="고소작업">⚠️ 고소</span>':""}</div>
      <div class="row"><span class="badge b-grade">${c.summary.top_grade}</span><span>${esc(c.summary.top_alarm)}</span>
        <span class="muted">알람 ${c.summary.alarm_count}건${c.summary.unresolved?` · 미해제 ${c.summary.unresolved}`:""} · 장비 ${c.sections.length}종</span></div>
      <div class="row"><span class="badge b-${d0.level}">${LEVEL[d0.level]}</span><span>${d0.level==="L2"?"(추정) ":""}${esc(cause)}</span></div>
    </div>
    <div class="body">
      <div class="caution">${c.cautions.map(x=>`<div>${esc(x)}</div>`).join("")}</div>
      <div class="contact muted">${esc(c.site.address)} · 설치형태 ${c.site.install_type} · 담당 ${esc(c.site.manager)} <a href="tel:${c.site.phone}">${c.site.phone}</a></div>
      ${c.sections.map(sectionHtml).join("")}
    </div></div>`;
}

function renderList(){
  const q = $("#q").value.trim().toLowerCase(), br = $("#fBranch").value, gr = $("#fGrade").value, lv = $("#fLevel").value;
  const list = CARDS.filter(c =>
    (!fDispatch || c.dispatch.class===fDispatch) && (!br || c.site.branch===br) && (!gr || c.summary.top_grade===gr) &&
    (!lv || c.sections.some(s=>s.diagnoses.some(d=>d.level===lv))) &&
    (!q || [c.site.id,c.site.name,...c.sections.flatMap(s=>s.alarms.map(a=>a.name))].join(" ").toLowerCase().includes(q))
  ).sort((a,b) => DISPATCH[a.dispatch.class].o-DISPATCH[b.dispatch.class].o || GRADE[a.summary.top_grade]-GRADE[b.summary.top_grade]
     || b.summary.unresolved-a.summary.unresolved || b.summary.alarm_count-a.summary.alarm_count);
  $("#list").innerHTML = list.length ? list.map(cardHtml).join("") : `<div class="empty">조건에 맞는 카드가 없습니다</div>`;
  document.querySelectorAll(".head").forEach(h => h.onclick = () => h.parentElement.classList.toggle("open"));
}

[...new Set(CARDS.map(c=>c.site.branch))].sort().forEach(b => $("#fBranch").insertAdjacentHTML("beforeend", `<option>${b}</option>`));
$("#top10").innerHTML = TOP10.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("");
["#q","#fBranch","#fGrade","#fLevel"].forEach(s => $(s).addEventListener("input", renderList));
renderKpis(); renderList();
</script>
</body>
</html>
